<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover + user-scalable=no: pantalla completa en iPad sin zoom accidental -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0f172a" />
    <meta name="description" content="Juego infantil de Luz Verde, Luz Roja para iPad. Camina despacio y quedate como estatua." />

    <!-- Modo standalone al añadir a la pantalla de inicio en iPadOS -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Luz Verde" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="icons/icon.svg" />

    <title>Luz Verde, Luz Roja</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Este juego necesita JavaScript para funcionar.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
