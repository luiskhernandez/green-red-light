name: Deploy a GitHub Pages

on:
  push:
    branches: [main]
  # Permite lanzar el despliegue a mano desde la pestaña Actions.
  workflow_dispatch:

# Necesario para que la accion pueda publicar en Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Un solo despliegue a la vez; los intermedios se descartan.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    name: Pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Pruebas unitarias
        run: npm test

      - name: Instalar navegador para Playwright
        run: npx playwright install --with-deps chromium

      - name: Pruebas de flujo
        run: npm run test:e2e

      - name: Guardar capturas de las pantallas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  build-and-deploy:
    name: Construir y publicar
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Construir
        # BASE_PATH debe coincidir con el nombre del repo para que las rutas
        # del service worker, el modelo y el wasm resuelvan bien en Pages.
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
